# The quality test set (scripts/quality): fixed questions (and class diary pictures) answered by the real AI
# and graded. It runs every other Monday (even ISO weeks; the "-latest" models change underneath the app) and by
# hand from the Actions tab (Run workflow). Not on every push: one full run uses the free key's whole daily
# allowance (owner's choice, 13 Nov). Below the pass mark (80% of the questions measured) the run fails; when the
# daily allowance runs out first, it says "not measured" instead.
# Needs the repository secret GOOGLE_API_KEY (Settings → Secrets and variables → Actions). Without it the
# run is skipped with a note.
name: Answer quality

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model that writes the answers (empty = gemini-flash-latest)"
        required: false
      judge_model:
        description: "Model that grades them (empty = the same)"
        required: false
      writer:
        description: "A free NVIDIA model that writes the first drafts instead (empty = Gemini writes). Needs the NVIDIA_API_KEY secret"
        required: false
      only:
        description: "Only these cases: id fragments separated by commas (empty = all)"
        required: false
  schedule:
    # Mondays 02:17 UTC (07:47 in India); odd weeks skip themselves (see "Which week").
    - cron: "17 2 * * 1"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Answer quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HAS_KEY: ${{ secrets.GOOGLE_API_KEY != '' }}
    steps:
      - name: Which week
        env:
          EVENT: ${{ github.event_name }}
        run: |
          week=$(date -u +%V)
          if [ "$EVENT" = "schedule" ] && [ $((10#$week % 2)) -eq 1 ]; then
            echo "RUN=false" >> "$GITHUB_ENV"
            echo "::notice title=Answer quality skipped::Week $week: the scheduled run is every other Monday (even weeks)."
          else
            echo "RUN=$HAS_KEY" >> "$GITHUB_ENV"
          fi
      - name: No Gemini key yet
        if: env.HAS_KEY != 'true'
        run: echo "::notice title=Answer quality skipped::Add the GOOGLE_API_KEY repository secret to run the quality test set."
      - uses: actions/checkout@v5
        if: env.RUN == 'true'
      - uses: actions/setup-node@v5
        if: env.RUN == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.RUN == 'true'
      - name: Answer and grade the test set
        if: env.RUN == 'true'
        run: npm run test:quality -- ${ONLY:+--only "$ONLY"}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          QUALITY_MODEL: ${{ inputs.model }}
          QUALITY_JUDGE_MODEL: ${{ inputs.judge_model }}
          QUALITY_WRITER: ${{ inputs.writer }}
          ONLY: ${{ inputs.only }}
      - name: Keep the full results
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quality-results
          path: scripts/quality/results/latest.json
          if-no-files-found: ignore
