# The quality test set (scripts/quality): fixed questions (and class diary pictures) answered by the real AI
# and graded. It runs when the AI's instructions, checks or page-finding change, every week (the "-latest"
# models change underneath the app), and by hand from the Actions tab (Run workflow). Below the pass mark
# (80% of cases passing) the run fails.
# Needs the repository secret GOOGLE_API_KEY (Settings → Secrets and variables → Actions). Without it the
# run is skipped with a note, so it never holds a release back.
name: Answer quality

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model that writes the answers (empty = gemini-flash-latest)"
        required: false
      judge_model:
        description: "Model that grades them (empty = the same)"
        required: false
  schedule:
    # Mondays 02:17 UTC (07:47 in India).
    - cron: "17 2 * * 1"
  push:
    paths:
      - "src/lib/generation/**"
      - "src/lib/llm/**"
      - "src/lib/rag/**"
      - "src/lib/homework/read-diary.ts"
      - "scripts/quality/**"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Answer quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HAS_KEY: ${{ secrets.GOOGLE_API_KEY != '' }}
    steps:
      - name: No Gemini key yet
        if: env.HAS_KEY != 'true'
        run: echo "::notice title=Answer quality skipped::Add the GOOGLE_API_KEY repository secret to run the quality test set."
      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_KEY == 'true'
      - name: Answer and grade the test set
        if: env.HAS_KEY == 'true'
        run: npm run test:quality
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          QUALITY_MODEL: ${{ inputs.model }}
          QUALITY_JUDGE_MODEL: ${{ inputs.judge_model }}
      - name: Keep the full results
        if: always() && env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quality-results
          path: scripts/quality/results/latest.json
          if-no-files-found: ignore
