<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Syllabi: no connection</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font-family: system-ui, sans-serif; }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.25rem; color: #475569; line-height: 1.5; }
      button { font: inherit; font-weight: 600; background: #4f46e5; color: #fff; border: 0; border-radius: .6rem; padding: .65rem 1.25rem; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f1f5f9; } p { color: #94a3b8; } }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Syllabi needs an internet connection to read your books and write answers. Check your connection, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
